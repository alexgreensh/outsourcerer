# Outsourcerer repo guards (lib/guards.sh). Read from the BASE branch: a lane's edit here is
# flagged for the reviewer and never used for its own run.
default = observe
# Plugin docs live in references/ and commands/; font licences in hub-assets/.
slop.md_allow = CHANGELOG.md README.md docs/ LICENSE*.md SECURITY.md CONTRIBUTING.md SKILL.md AGENTS.md CLAUDE.md references/ commands/ hub-assets/
