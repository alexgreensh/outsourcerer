/* Layout: app shell in Alex's site style. Left rail (brand, projects with their open decisions, credits), one project in the main pane, hover cards for detail. Paper and ink, yellow highlighter as the one accent; light and dark. */
:root {
  --paper: #fbfaf7; --ink: #1f1f1c; --line: #8f8a7e; --thumb: #efede7; --card: #ffffff;
  --hi: #ffe866; --hi-soft: #fff7c7; --hi-line: #1f1f1c; --mark: #ffe866; --on-hi: #1f1f1c;
  --up: #10331a; --up-bg: #dff5e3; --down: #5c1a12; --down-bg: #fbe3dc;
  --blob: #1f1f1c; --eye: #fff8e1; --shadow: #1f1f1c; --pop: #ffffff; --hov-fill: var(--card); --edge: #1f1f1c; --track: #cbc7bd; --focus: #1f1f1c; --dot-ok: #2f8f4e; --dot-out: #c2412d;
  --cjk: "PingFang SC", "Hiragino Sans", "Apple SD Gothic Neo", "Microsoft YaHei", "Yu Gothic UI", "Malgun Gothic", "Noto Sans CJK SC", "Noto Sans CJK JP", "Noto Sans CJK KR";
  --sans: "Poppins", "Noto Sans Hebrew", ui-sans-serif, system-ui, -apple-system, "Segoe UI", var(--cjk), sans-serif;
  --mono: var(--sans);
  --code: ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
/* Hebrew/CJK: wrap at word boundaries only; mid-word breaking shreds CJK (item 16). */
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; overflow-wrap: break-word; word-break: normal; line-break: strict; font-variant-numeric: tabular-nums; }
[dir="auto"] { unicode-bidi: plaintext; text-align: start; }
[hidden] { display: none !important; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100%; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 6px var(--hi); }
.mark { background: none; padding: 0; }
.lg { stroke: var(--ink); } .lg-body { fill: var(--blob); } .lg-hi { fill: var(--hi); } .lg-eye { fill: var(--eye); }

.rail { color: var(--ink); background: var(--card); border-right: 1.5px solid var(--edge); display: flex; flex-direction: column; gap: 16px; padding-block: 18px 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; position: sticky; top: 0; height: 100vh; height: 100dvh; overflow: hidden; }
.rail-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; }
.rail-mid { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; margin-inline: -6px; padding-inline: 6px; scrollbar-width: thin; }
.cred-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.byline { font-size: .82rem; }
.tgl .tl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; color: inherit; }
.brand svg { width: 50px; height: 47px; flex: none; overflow: visible; }
.wiz-bob, .wiz-wand, .wiz-spark, .wiz-star, .wiz-eye { transform-box: fill-box; }
.wiz-wand { transform-origin: 0% 100%; }
.wiz-spark, .wiz-star, .wiz-eye { transform-origin: center; }
@media (prefers-reduced-motion: no-preference) {
  .wiz-bob { animation: wiz-bob 3.2s ease-in-out infinite; }
  .wiz-spark { animation: wiz-spark 2.2s ease-in-out infinite; }
  .wiz-star { animation: wiz-twinkle 2.6s ease-in-out infinite; }
  .wiz-star.s2 { animation-delay: .7s; } .wiz-star.s3 { animation-delay: 1.4s; }
  .wiz-eye { animation: wiz-blink 5s infinite; }
  .brand:hover .wiz-wand, .brand:focus-visible .wiz-wand { animation: wiz-wave .9s ease-in-out 2; }
}
@keyframes wiz-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes wiz-spark { 0%, 100% { transform: scale(.85) rotate(0deg); opacity: .85; } 50% { transform: scale(1.2) rotate(45deg); opacity: 1; } }
@keyframes wiz-twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
@keyframes wiz-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes wiz-wave { 0%, 100% { transform: rotate(0deg); } 30% { transform: rotate(-14deg); } 70% { transform: rotate(10deg); } }

.brand .tag { font-family: var(--mono); font-size: .78rem; font-weight: 700; }
.rail h2 { margin: 0; font-size: 1rem; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
.rail h2:has(.lfold) { align-items: center; } /* the fold button's 32px box pulled its count 4px low (MC-5 #9) */
.rail h2 > span:last-child { white-space: nowrap; }
.plist { display: flex; flex-direction: column; gap: 8px; }
.proj { display: flex; flex-direction: column; gap: 4px; border-radius: 14px; border: 1.5px solid transparent; padding: 6px; }
.proj.on { background: var(--hi-soft); border-color: var(--hi-line); }
.pbtn { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: none; border: 0; padding: 6px 6px; border-radius: 10px; cursor: pointer; text-align: left; width: 100%; }
.pbtn .nm { text-align: left; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--edge); background: var(--card); }
.dot.building { background: var(--thumb); }
.dot.waiting { background: var(--hi); }
.dot.shipped { background: var(--dot-ok); border-color: var(--dot-ok); }
.dot.paused { border-style: dashed; }
.dlist { list-style: none; margin: 0; padding: 0 0 0 22px; display: flex; flex-direction: column; gap: 2px; }
.dbtn { min-height: 36px; display: flex; gap: 8px; align-items: center; background: none; border: 0; padding: 4px 6px; border-radius: 8px; cursor: pointer; text-align: left; width: 100%; font-size: .9rem; }
.dbtn span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dbtn:hover, .pbtn:hover { background: color-mix(in srgb, var(--ink) 9%, transparent); }
.pri { flex: none; display: inline-flex; align-items: center; font-family: var(--mono); font-weight: 700; font-size: .75rem; padding: 1px 8px; border-radius: 999px; border: 1.5px solid var(--edge); background: var(--card); }
.p-critical { background: var(--down-bg); color: var(--down); border-color: var(--down); }
.p-high { background: var(--hi); color: var(--on-hi); border-color: var(--ink); }
.p-medium { background: var(--thumb); }
.credits { flex: none; display: flex; flex-direction: column; gap: 8px; border-top: 1.5px solid var(--line); padding-top: 12px; font-size: .9rem; }
.credits a { color: var(--ink); }
.star { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 600; font-size: .85rem; padding: 4px 12px; border-radius: 999px; border: 1.5px solid var(--edge); background: var(--card); color: var(--ink) !important; }
.star:hover { background: var(--hi); color: var(--on-hi) !important; box-shadow: 3px 3px 0 var(--shadow); transform: translate(-1px, -1px); }
.star .cnt { font-family: var(--mono); border-left: 1.5px solid var(--edge); padding-left: 8px; }
.social { display: flex; gap: 14px; align-items: center; }
.social a { display: inline-flex; padding: 8px; margin: -8px 0; }
@media (hover: none) { .pt-name, .lfold, .dbtn, .social a, .tgl button { min-height: 44px; } }
.social a:hover { transform: translateY(-1px); }
.theme-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tgl { flex: none; display: inline-flex; border: 1.5px solid var(--edge); border-radius: 999px; overflow: hidden; }
.tgl button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--card); padding: 6px 9px; cursor: pointer; font-size: .85rem; font-weight: 600; }
.tgl button[aria-pressed="true"] { background: var(--hi); color: var(--on-hi); }

.main { padding-block: 32px 64px; padding-left: clamp(48px, 9vw, 128px); padding-right: max(clamp(48px, 9vw, 128px), env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 40px; min-width: 0; width: 100%; max-width: 1600px; }
.ph { display: flex; flex-direction: column; gap: 10px; }
.ph h1 { margin: 0; font-weight: 700; font-size: clamp(2rem, 4.5vw, 3rem); line-height: 1.1; text-wrap: balance; }
.ph .lede { margin: 0; max-width: 80ch; font-size: 1.1rem; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1.5px solid var(--edge); background: var(--card); white-space: nowrap; }
.stamp { font-family: var(--mono); font-weight: 700; background: var(--card); border-color: var(--edge); }
.board-link { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); background: var(--card); border: 1.5px solid var(--edge); font-weight: 600; padding: 4px 14px; border-radius: 999px; }
.board-link:hover { background: var(--hi); color: var(--on-hi); box-shadow: 3px 3px 0 var(--shadow); transform: translate(-1px, -1px); }
.stats { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 16px; }
.card { color: var(--ink); background: var(--card); border: 1.5px solid var(--edge); border-radius: 16px; padding: 20px; min-width: 0; }
.stat { display: flex; flex-direction: column; gap: 10px; }
.stat .k { font-weight: 600; font-size: 1rem; display: inline-flex; align-items: center; gap: 8px; }
[data-lucide], svg.lucide { width: 1em; height: 1em; stroke-width: 2.2; flex: none; vertical-align: -0.14em; }
.logo { width: 1em; height: 1em; flex: none; vertical-align: -0.14em; }
.stamp-top { margin: 0; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-weight: 700; font-size: .95rem; padding: 4px 12px; border: 1.5px solid var(--edge); border-radius: 999px; background: var(--card); }
.stamp-top.stale { background: var(--down-bg); color: var(--down); border-color: var(--down); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .8rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1.5px solid var(--edge); white-space: nowrap; background: var(--card); }
.plats { display: inline-flex; gap: 4px; margin-left: 6px; font-size: 14px; vertical-align: -0.1em; }
.wt { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-weight: 700; font-size: .78rem; padding: 2px 10px; border-radius: 999px; border: 1.5px solid var(--edge); }
.w-crit { background: var(--down-bg); color: var(--down); border-color: var(--down); }
.w-high { background: var(--hi); color: var(--on-hi); }
.w-med { background: var(--thumb); }
.w-low { background: var(--card); }
.sub { margin: 0; }
.dli { display: flex; flex-direction: column; gap: 4px; }
.llist { display: flex; flex-direction: column; gap: 4px; }
.lrow { display: grid; grid-template-columns: 12px minmax(7em, 1fr) auto; gap: 4px 10px; align-items: center; padding: 6px; border-radius: 10px; background: none; border: 0; text-align: left; width: 100%; cursor: default; }
.lrow:hover { background: color-mix(in srgb, var(--ink) 9%, transparent); }
.lrow .nm { font-weight: 600; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; align-items: center; min-width: 0; }
.lrow .nmt { min-width: 0; white-space: normal; overflow-wrap: anywhere; line-height: 1.25; } .lrow .tags { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; } /* PL: icon inline left of the name, the name wraps (never truncated), pills on their own line */
.lrow .lf { font-family: var(--mono); font-size: .78rem; font-weight: 700; text-align: right; white-space: nowrap; align-self: start; padding-top: 1px; }
.lrow .rn { grid-column: 2 / 4; font-size: .82rem; display: inline-flex; align-items: center; gap: 6px; }
.lst, .psum { font-size: .8rem; font-weight: 700; } /* MC-10: the lane summary wears the stamp's type */
.lst.stale { color: var(--down); background: var(--down-bg); border-radius: 999px; padding: 2px 8px; }
.lfold { min-height: 32px; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.lfold .chev { width: 18px; height: 18px; transition: transform .15s ease; }
.lfold[aria-expanded="true"] .chev { transform: rotate(90deg); }
.lrow { cursor: pointer; font: inherit; color: inherit; }
.lmore { font-size: .82rem; font-weight: 600; padding: 2px 6px; }
.lnone { margin: 0; font-size: .9rem; }
.dot.ok { background: var(--dot-ok); border-color: var(--dot-ok); }
.dot.low { background: var(--hi); }
.dot.out { background: var(--dot-out); border-color: var(--dot-out); }
.dot.unknown, .dot.wait { border-style: dashed; }
.dot.review { background: var(--hi-soft); }
.hlogo { width: 18px; height: 18px; flex: none; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
.hlogo svg, .hlogo img { width: 18px; height: 18px; display: block; }
.hlogo img { border-radius: 4px; }
.paidtag { flex: none; font-family: var(--mono); font-size: .75rem; font-weight: 700; padding: 0 6px; border-radius: 999px; border: 1.5px solid var(--edge); color: var(--ink); background: transparent; } /* MC3: neutral outline, not an error red */
.big { font-family: var(--mono); font-weight: 700; font-size: clamp(3rem, 9vw, 4.5rem); line-height: 1; }
.stat.wait { background: var(--hi-soft); border-color: var(--hi-line); }
.mid { font-weight: 700; font-size: 1.6rem; line-height: 1.15; }
.bar { height: 16px; border: 1.5px solid var(--edge); border-radius: 999px; overflow: hidden; background: var(--thumb); }
.bar > span { display: block; height: 100%; width: 0; background: var(--hi); border-right: 1.5px solid var(--edge); }
section { display: flex; flex-direction: column; gap: 16px; }
section > h2 { margin: 0; font-size: 1.5rem; font-weight: 600; text-wrap: balance; }
.lanes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--paper); cursor: pointer; text-align: left; width: 100%; }
.tile:hover { border-color: var(--ink); }

  const grown = new Set();   // bars animate the first time only; a re-render sets the width directly (MC-5 #4)

      st.append(ic('clock'), el('span', null, 'Updated ' + (H && H.localStamp && Date.parse(p.updatedAt || '') ? H.localStamp(Date.parse(p.updatedAt)) : p.updated))); ph.append(st); }
    ph.append(h1, el('p', 'lede', p.tagline || ''), meta);

    staleCheck();   // stamp must be in the DOM for querySelectorAll to find it

    const ds = openDecs(p);

    const cards = [], card = (k, cls) => { const c = el('div', 'card stat' + (cls || '')); c.append(k); cards.push(c); return c; }, key = (icn, t) => { const k = el('span', 'k'); if (icn) k.append(ic(icn)); k.append(document.createTextNode(t)); return k; };
    if (pctOk(p)) { const bar = el('div', 'bar'), fill = el('span'); bar.appendChild(fill); card(key(null, 'Done so far')).append(el('span', 'big', p.pct + '%'), bar);
      if (grown.has(p.id)) { fill.style.transition = 'none'; fill.style.width = p.pct + '%'; } else { grown.add(p.id); requestAnimationFrame(() => { fill.style.width = p.pct + '%'; }); } }
    if (p.eta || p.freeze) { const s2 = card(key('rocket', 'Release goes live')); if (p.eta) s2.append(el('span', 'mid', p.eta));
      if (p.freeze) { const fz = el('span'); fz.append(ic('snowflake'), document.createTextNode(' Code freeze '), el('b', 'mono', p.freeze)); s2.append(fz); } if (p.etaNote) s2.append(el('span', null, p.etaNote)); }
    if (p.next) card(key('arrow-right', 'Next step')).append(el('span', null, p.next));
    card(key('hand', 'Waiting on you'), ds.length ? ' wait' : '').append(el('span', 'big', String(ds.length)), el('span', null, ds.length === 0 ? 'Nothing needs you' : ds.length === 1 ? 'decision, see below' : 'decisions, see below'));
    if (stats.style && stats.style.setProperty) stats.style.setProperty('--cols', String(cards.length === 4 ? 2 : cards.length));

    const decSec = () => {

      if (l.session) {
        const ob = el('button', 'open', 'Open session'); ob.type = 'button'; ob.id = 'open-' + p.id + '-' + l.id;

      c.setAttribute('aria-label', l.short + ', ' + (l.status || 'Building') + (pctOk(l) ? ', ' + l.pct + ' percent' : ''));

  function refocus(keep) { const n = keep && $(keep.id); if (n) { n.focus({ preventScroll: true }); if (keep.s != null && n.setSelectionRange) try { n.setSelectionRange(keep.s, keep.e, keep.d || 'none'); } catch (e) {} } }
  // Poll-driven renders wait while a field is mid-IME (Hebrew/CJK) or a send is in flight; a click (go, Home) never waits (MC-6).
  function pollRender() { if (composing && compEl !== document.activeElement) composing = false; if (composing || (D && D.busy())) { pending = true; return; } renderMain(); }
  const flush = (force) => { if ((pending || force) && !composing && !(D && D.busy())) { pending = false; renderMain(); } };
  let compEl = null;   // the composing field; losing it (focusout, removed, window switch) ends the hold, so the board never stops updating

  document.addEventListener('focusout', (e) => { if (composing && e.target === compEl) { composing = false; flush(); } });

  function go(pid, did) {

    else window.scrollTo({ top: 0 });

  // Home is the default screen (no hash or #home); a project hash still deep-links.
  function pickStart() {

    if (h && projects.some((p) => p.id === h)) return h;
    if (H) return null;
    const w = projects.find((p) => openDecs(p).length);   // hub-home.js missing: old project-first start

  // Home, Mark done and Refresh live in assets/hub-home.js (keeps this file under 1,000 lines).
  const H = typeof window.OSRC_HUB_HOME === 'function' ? window.OSRC_HUB_HOME({
    $, el, ic, pri, paint, openDecs, byWeight, STATUS_TXT, stPill, go, hide, renderRail, renderMain, staleCheck,
    get projects() { return projects; }, get also() { return also; }, get limits() { return limits; }, LSTATE, hlogo, get db() { return db; }, get mode() { return mode; }, get pullErr() { return pullErr; },
    get canWrite() { return canWrite; }, set canWrite(v) { canWrite = v; },
  }) : null;
  const D = typeof window.OSRC_HUB_DECIDE === 'function' ? window.OSRC_HUB_DECIDE({ el, ic, tags, flush: (f) => flush(f), get db() { return db; } }) : null;

  (async () => {
    const timer = setTimeout(() => { if (!projects.length) { renderRail(); if (db) renderMain(); } }, 10000);
    let real = null;
    try { real = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { real = null; }
    if (real) {
      mode = 'artifact'; db = real;
      try { const u = await window.claude.use('user'); if (u && u.can) canWrite = await u.can('data.write'); } catch (e) { canWrite = null; }
      subscribe(db);
      clearTimeout(timer);
      return;
    }
    // No artifact db: local mode via hub serve (token from the bookmark URL,
    // then kept in sessionStorage and sent as the X-Hub-Token header).
    mode = 'local';
    if (!TOKEN) {
      // The shell itself is public (static, no data) so a reload after ?t= was
      // stripped, or a bare link, still renders — but the data API stays
      // locked. Without a token there is nothing to subscribe to: say how to
      // get in instead of polling into 403s (r4 finding 1).
      clearTimeout(timer);
      const w = $('welcome'), pe = $('plist-empty');
      if (w) {

      }
      if (pe) pe.textContent = 'No token — open the link hub serve printed.';
      return;
    }
    db = makeLocalDb();
    subscribe(db);
    clearTimeout(timer);
    // No blind timer: the first answer (applyProjects) or the first failure (onSnapshot error) ends "Loading" (MC-8).
  })();

  (function stars() {
    let n = null;
    try { n = sessionStorage.getItem('osrc-stars'); } catch (e) {}
    const show = (v) => { if (v == null) return; const s = $('stars'); s.textContent = Number(v) >= 1000 ? (Number(v) / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(v); s.hidden = false; };
    if (n) { show(n); return; }
    // Local mode never touches the network (review A2); the star count is an
    // artifact-mode nicety only.
    if (mode !== 'artifact') return;
    fetch('https://api.github.com/repos/alexgreensh/outsourcerer').then((r) => r.ok ? r.json() : null).then((j) => { if (j && typeof j.stargazers_count === 'number') { show(j.stargazers_count); try { sessionStorage.setItem('osrc-stars', j.stargazers_count); } catch (e) {} } }).catch(() => {});
  })();
})();
