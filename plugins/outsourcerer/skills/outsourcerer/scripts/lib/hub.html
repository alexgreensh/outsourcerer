/* Layout: app shell in Alex's site style. Left rail (brand, projects with their open decisions, credits), one project in the main pane, hover cards for detail. Paper and ink, yellow highlighter as the one accent; light and dark. */
:root {
  --paper: #fbfaf7; --ink: #1f1f1c; --line: #8f8a7e; --thumb: #efede7; --card: #ffffff;
  --hi: #ffe866; --hi-soft: #fff7c7; --hi-line: #1f1f1c; --mark: #ffe866; --on-hi: #1f1f1c;
  --up: #10331a; --up-bg: #dff5e3; --down: #5c1a12; --down-bg: #fbe3dc;
  --blob: #1f1f1c; --eye: #fff8e1; --shadow: #1f1f1c; --pop: #ffffff; --hov-fill: var(--card); --edge: #1f1f1c; --track: #cbc7bd; --focus: #1f1f1c; --dot-ok: #2f8f4e; --dot-out: #c2412d;
  --sans: "Outfit", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #16171a; --ink: #ededf0; --line: #34363d; --thumb: #2b2d33; --card: #1f2024;
  --hi: #ffe866; --hi-soft: #24241f; --hi-line: #e8d45a; --mark: transparent; --on-hi: #1f1f1c;
  --up: #9fe3b4; --up-bg: #173a24; --down: #ffb4a6; --down-bg: #3f1c16;
  --blob: #0e0f11; --eye: #fff8e1; --shadow: transparent; --pop: #27292e; --hov-fill: var(--thumb); --edge: #3a3d45; --track: #34363d; --focus: #ffe866; --dot-ok: #9fe3b4; --dot-out: #ffb4a6; color-scheme: dark; } }

  --up: #9fe3b4; --up-bg: #173a24; --down: #ffb4a6; --down-bg: #3f1c16;
  --blob: #0e0f11; --eye: #fff8e1; --shadow: transparent; --pop: #27292e; --hov-fill: var(--thumb); --edge: #3a3d45; --track: #34363d; --focus: #ffe866; --dot-ok: #9fe3b4; --dot-out: #ffb4a6; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100%; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 6px var(--hi); }
.mark { background: none; padding: 0; }
.lg { stroke: var(--ink); } .lg-body { fill: var(--blob); } .lg-hi { fill: var(--hi); } .lg-eye { fill: var(--eye); }

.rail { color: var(--ink); background: var(--card); border-right: 1.5px solid var(--edge); display: flex; flex-direction: column; gap: 16px; padding-block: 18px 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; position: sticky; top: 0; height: 100vh; height: 100dvh; overflow: hidden; }
.rail-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; }
.rail-mid { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; margin-inline: -6px; padding-inline: 6px; scrollbar-width: thin; }
.cred-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.byline { font-size: .82rem; }
.tgl .tl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; color: inherit; }
.brand svg { width: 50px; height: 47px; flex: none; overflow: visible; }
.wiz-bob, .wiz-wand, .wiz-spark, .wiz-star, .wiz-eye { transform-box: fill-box; }
.wiz-wand { transform-origin: 0% 100%; }
.wiz-spark, .wiz-star, .wiz-eye { transform-origin: center; }
@media (prefers-reduced-motion: no-preference) {
  .wiz-bob { animation: wiz-bob 3.2s ease-in-out infinite; }
  .wiz-spark { animation: wiz-spark 2.2s ease-in-out infinite; }
  .wiz-star { animation: wiz-twinkle 2.6s ease-in-out infinite; }
  .wiz-star.s2 { animation-delay: .7s; } .wiz-star.s3 { animation-delay: 1.4s; }
  .wiz-eye { animation: wiz-blink 5s infinite; }
  .brand:hover .wiz-wand, .brand:focus-visible .wiz-wand { animation: wiz-wave .9s ease-in-out 2; }
}
@keyframes wiz-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes wiz-spark { 0%, 100% { transform: scale(.85) rotate(0deg); opacity: .85; } 50% { transform: scale(1.2) rotate(45deg); opacity: 1; } }
@keyframes wiz-twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
@keyframes wiz-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes wiz-wave { 0%, 100% { transform: rotate(0deg); } 30% { transform: rotate(-14deg); } 70% { transform: rotate(10deg); } }

.brand .tag { font-family: var(--mono); font-size: .78rem; font-weight: 700; }
.rail h2 { margin: 0; font-size: 1rem; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
.rail h2 > span:last-child { white-space: nowrap; }
.plist { display: flex; flex-direction: column; gap: 8px; }
.proj { display: flex; flex-direction: column; gap: 4px; border-radius: 14px; border: 1.5px solid transparent; padding: 6px; }
.proj.on { background: var(--hi-soft); border-color: var(--hi-line); }
.pbtn { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: none; border: 0; padding: 6px 6px; border-radius: 10px; cursor: pointer; text-align: left; width: 100%; }
.pbtn .nm { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--edge); background: var(--card); }
.dot.building { background: var(--thumb); }
.dot.waiting { background: var(--hi); }
.dot.shipped { background: var(--dot-ok); border-color: var(--dot-ok); }
.dot.paused { border-style: dashed; }
.dlist { list-style: none; margin: 0; padding: 0 0 0 22px; display: flex; flex-direction: column; gap: 2px; }
.dbtn { display: flex; gap: 8px; align-items: center; background: none; border: 0; padding: 4px 6px; border-radius: 8px; cursor: pointer; text-align: left; width: 100%; font-size: .9rem; }
.dbtn span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dbtn:hover, .pbtn:hover { background: color-mix(in srgb, var(--ink) 9%, transparent); }
.pri { flex: none; display: inline-flex; align-items: center; font-family: var(--mono); font-weight: 700; font-size: .75rem; padding: 1px 8px; border-radius: 999px; border: 1.5px solid var(--edge); background: var(--card); }
.p-critical { background: var(--down-bg); color: var(--down); border-color: var(--down); }
.p-high { background: var(--hi); color: var(--on-hi); border-color: var(--ink); }
.p-medium { background: var(--thumb); }
.credits { flex: none; display: flex; flex-direction: column; gap: 8px; border-top: 1.5px solid var(--line); padding-top: 12px; font-size: .9rem; }
.credits a { color: var(--ink); }

      if (done.length) {
        const det = el('details', 'card decided'); det.appendChild(el('summary', null, 'Already decided (' + done.length + ')'));
        const ul = el('ul'); done.forEach((d) => { const a = answers[p.id + '--' + d.id]; const li = el('li', 'dli'); li.append(tags(d), el('span', null, (d.q || d.short) + (a ? ' Your answer: ' + (a.choice || a.note) : ''))); ul.appendChild(li); });
        det.appendChild(ul); sec.appendChild(det);
      }
      main.appendChild(sec);
    }
    };
    if (ds.length) decSec();

    const lanes = p.lanes || [];
    const laneTile = (l) => {
      const c = el('div', 'tile' + (l.session ? ' has-open' : '')); c.tabIndex = 0; c.id = 'lane-' + p.id + '-' + l.id; c.setAttribute('role', 'group');
      const nm = el('span', 'nm'); const nt = el('span', null, l.short);
      if (Array.isArray(l.plats) && l.plats.length) { const pl = el('span', 'plats'); l.plats.forEach((x) => pl.appendChild(logo(x))); nt.appendChild(pl); }
      nm.append(nt); const rf = refs(l.repo || p.repo, l.issues); if (rf) nm.append(rf);
      c.append(ring(l.pct), nm, chip(l.status));
      if (l.session) {
        const ob = el('button', 'open', 'Open session'); ob.type = 'button'; ob.id = 'open-' + p.id + '-' + l.id;
        ob.title = 'Copies the command that shows this delegate in your terminal';
        ob.addEventListener('click', (e) => { e.stopPropagation(); hide(); openSession(ob, l.session); });
        c.append(ob);
      }
      c.setAttribute('aria-label', l.short + ', ' + (l.status || 'Building') + ', ' + (l.pct || 0) + ' percent');
      hover(c, (h) => { h.append(el('div', 'ht', l.short)); const row = el('div', 'row'); row.append(chip(l.status), el('span', 'mono', (l.pct || 0) + '%')); if (l.model) row.append(el('span', null, l.model)); if (l.issues) { const gi = el('span', 'chip'); gi.append(logo('github'), document.createTextNode(l.issues)); row.appendChild(gi); } h.append(row); if (l.note) h.append(el('p', null, l.note)); if (l.branch) h.append(el('p', 'where', 'Branch: ' + l.branch)); if (l.worktree) h.append(el('p', 'where', 'Worktree: ' + l.worktree)); if (l.session) h.append(el('p', 'where', 'Session: ' + l.session)); });
      return c;
    };
    const norm = (s) => String(s || 'Building').toLowerCase();
    const flow = p.flow || [
      { t: 'Build', match: ['building', 'blocked'], w: 'Lanes write the change', d: 'Each lane works in its own branch and worktree.' },
      { t: 'Review', match: ['review', 'fixing review'], w: 'One reviewer checks', d: 'Every change is read before it merges. Real problems go back to the lane.' },
      { t: 'Merged', match: ['merged', 'done'], w: 'Joined the release', d: 'Reviewed work lands on the release branch.' },
      { t: 'Live', match: ['shipped'], w: p.eta || 'Not set', d: 'Released to users.' }
    ];
    if (lanes.length) {
      const sec = el('section'); sec.append(el('h2', null, 'How a fix gets to your users'), el('p', 'sub', 'Numbers show how many tracks sit at each step right now.'));
      const row = el('div', 'flow'); const sc = el('div', 'flow-scroll'); sc.appendChild(row);
      const sm = (s) => (Array.isArray(s && s.match) ? s.match : []);
      const groups = flow.map((s) => lanes.filter((l) => sm(s).includes(norm(l.status))));
      const nowIdx = groups.findIndex((g) => g.length);
      flow.forEach((s0, i) => {
        const s = (typeof s0 === 'string') ? { t: s0 } : (s0 || {});
        const g = groups[i];
        const b = el('button', 'node' + (i === nowIdx ? ' now' : '')); b.type = 'button'; b.id = 'flow-' + p.id + '-' + i;
        const tt = el('span', 't'); tt.append(ic(s.i || FLOW_ICON[String(s.t).toLowerCase()] || 'circle-dot'), document.createTextNode(s.t));
        b.append(el('span', 'n', g.length ? String(g.length) : (sm(s).length ? '0' : '·')), tt, el('span', 'w', s.w || ''));
        hover(b, (c) => { c.append(el('div', 'ht', s.t), el('p', null, s.d || '')); if (g.length) c.append(el('p', null, 'Here now: ' + g.map((l) => l.short).join(', ') + '.')); });
        row.appendChild(b);
      });
      sec.appendChild(sc); main.appendChild(sec);

      const sec2 = el('section'); sec2.append(el('h2', null, 'The work, by theme'));
      const themes = (p.themes && p.themes.length) ? p.themes : [{ k: '', t: 'All lanes' }];
      const wrap = el('div', 'themes');
      themes.forEach((th) => {
        const list = th.k ? lanes.filter((l) => l.theme === th.k) : lanes;
        if (!list.length) return;
        const avg = Math.round(list.reduce((s, l) => s + (l.pct || 0), 0) / list.length);
        const box = el('div', 'card theme'); const h = el('h3'); h.append(el('span', null, th.t), el('span', 'mono', avg + '%'));
        const grid = el('div', 'lanes'); list.forEach((l) => grid.appendChild(laneTile(l)));
        box.append(h, grid); wrap.appendChild(box);
      });
      const orphans = (p.themes && p.themes.length) ? lanes.filter((l) => !p.themes.some((th) => th.k === l.theme)) : [];
      if (orphans.length) { const box = el('div', 'card theme'); box.append(el('h3', null, 'Other')); const grid = el('div', 'lanes'); orphans.forEach((l) => grid.appendChild(laneTile(l))); box.appendChild(grid); wrap.appendChild(box); }
      // Balanced two-column packing (Alex 18:40): each card joins the shorter column, so a short theme never leaves a hole beside a tall one.
      const cards = [...wrap.children];
      if (cards.length > 1) {
        const cols = [el('div', 'tcol'), el('div', 'tcol')], hgt = [0, 0];
        cards.forEach((c) => {
          const w = 1.2 + [...c.querySelectorAll('.tile')].reduce((a, t) => a + 1 + Math.floor(t.querySelectorAll('.refs > *').length / 4) * 0.4, 0);
          const i = hgt[0] <= hgt[1] ? 0 : 1; cols[i].appendChild(c); hgt[i] += w;
        });
        wrap.replaceChildren(...cols.filter((c) => c.children.length));
      } else wrap.style.gridTemplateColumns = '1fr';
      sec2.appendChild(wrap); main.appendChild(sec2);
    }
    if (!ds.length) decSec();
    main.appendChild(el('p', 'foot', 'Last updated ' + (p.updated || 'not yet') + '. Each orchestrator refreshes its own project here as tracks move.'));
    paint();
  }

  function decCard(p, d) {
    const c = el('div', 'card dec'); c.id = 'dec-' + d.id;
    c.append(tags(d), el('span', 'q', d.q));
    if (d.rec) c.append(el('span', null, d.rec));
    if (d.when) c.append(el('span', 'mono', 'Needed by ' + d.when));
    const a = el('div', 'ans'); const opts = el('div', 'opts');
    const f = { choice: '', btns: [] };
    (d.options || []).forEach((o, i) => {
      const b = el('button', 'opt', o); b.type = 'button'; b.id = 'opt-' + p.id + '-' + d.id + '-' + i; b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => { f.choice = f.choice === o ? '' : o; f.btns.forEach((x) => x.setAttribute('aria-pressed', String(x.textContent === f.choice))); sync(); });
      f.btns.push(b); opts.appendChild(b);
    });
    const ta = document.createElement('textarea'); ta.id = 'note-' + p.id + '-' + d.id; ta.placeholder = 'Anything to add, or your own answer'; ta.setAttribute('aria-label', 'Note');
    const go2 = el('button', 'go'); go2.append(ic('send'), document.createTextNode('Send answer')); go2.type = 'button'; go2.id = 'send-' + p.id + '-' + d.id;
    const st = el('span', 'saved'); st.setAttribute('aria-live', 'polite');
    const sync = () => { go2.disabled = !db || (!f.choice && !ta.value.trim()); };
    ta.addEventListener('input', sync); sync();
    if (!db) st.textContent = 'Answering works when you are signed in on claude.ai.';
    go2.addEventListener('click', async () => {
      go2.disabled = true; st.textContent = 'Saving…';
      try {
        await db.doc('answers/' + p.id + '--' + d.id).set({ project: p.id, decision: d.id, question: d.q, choice: f.choice, note: ta.value.trim(), at: new Date().toISOString() });
        st.classList.remove('err'); st.textContent = 'Saved. Your orchestrator reads it when it checks Mission Control.';
      } catch (e) { st.classList.add('err'); st.textContent = 'Not saved: ' + ((e && e.message) || 'try again'); sync(); }
    });
    a.append(opts, ta, go2, st); c.appendChild(a);
    return c;
  }

  function go(pid, did) {
    current = pid;
    try { if (location.hash !== '#' + pid) history.replaceState(null, '', '#' + pid); } catch (e) {}
    renderRail(); renderMain();
    if (did) { const c = document.getElementById('dec-' + did); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('flash'); setTimeout(() => c.classList.remove('flash'), 1600); } }
    else window.scrollTo({ top: 0 });
  }
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== current && projects.some((p) => p.id === h)) go(h); });

  function pickStart() {
    const h = location.hash.slice(1);
    if (h && projects.some((p) => p.id === h)) return h;
    const w = projects.find((p) => openDecs(p).length);
    return (w || projects[0] || {}).id || null;
  }

  (async () => {
    const timer = setTimeout(() => { if (!projects.length) renderRail(); }, 10000);
    let real = null;
    try { real = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { real = null; }
    if (real) {
      mode = 'artifact'; db = real;
      subscribe(db);
      clearTimeout(timer);
      return;
    }
    // No artifact db: local mode via hub serve (token in the URL, then the cookie).
    mode = 'local';
    db = makeLocalDb();
    subscribe(db);
    clearTimeout(timer);
    // First pull failure surfaces in the rail instead of hanging on "Loading…".
    setTimeout(() => { if (!projects.length) renderRail(); }, 3000);
  })();

  (function stars() {
    let n = null;
    try { n = sessionStorage.getItem('osrc-stars'); } catch (e) {}
    const show = (v) => { if (v == null) return; const s = $('stars'); s.textContent = Number(v) >= 1000 ? (Number(v) / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(v); s.hidden = false; };
    if (n) { show(n); return; }
    fetch('https://api.github.com/repos/alexgreensh/outsourcerer').then((r) => r.ok ? r.json() : null).then((j) => { if (j && typeof j.stargazers_count === 'number') { show(j.stargazers_count); try { sessionStorage.setItem('osrc-stars', j.stargazers_count); } catch (e) {} } }).catch(() => {});
  })();
})();
</script>
