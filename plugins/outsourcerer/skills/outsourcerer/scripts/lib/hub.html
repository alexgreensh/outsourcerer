<style>
/* Layout: app shell in Alex's site style. Left rail (brand, projects with their open decisions, credits), one project in the main pane, hover cards for detail. Paper and ink, yellow highlighter as the one accent; light and dark. */
:root {
  --paper: #fbfaf7; --ink: #1f1f1c; --line: #cbc7bd; --thumb: #efede7; --card: #ffffff;
  --hi: #ffe866; --hi-soft: #fff7c7; --hi-line: #1f1f1c; --mark: #ffe866; --on-hi: #1f1f1c;
  --up: #10331a; --up-bg: #dff5e3; --down: #5c1a12; --down-bg: #fbe3dc;
  --blob: #1f1f1c; --eye: #fff8e1; --shadow: #1f1f1c;
  --sans: "Outfit", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #0f1012; --ink: #eceef2; --line: #3a3d44; --thumb: #24262b; --card: #18191c;
  --hi: #ffe866; --hi-soft: #1d1e22; --hi-line: #ffe866; --mark: rgba(255, 232, 102, .32); --on-hi: #1f1f1c;
  --up: #b9e8c6; --up-bg: #15281c; --down: #f7c2b8; --down-bg: #33191a;
  --blob: #050506; --eye: #fff8e1; --shadow: #000000; color-scheme: dark; } }
:root[data-theme="dark"] { --paper: #0f1012; --ink: #eceef2; --line: #3a3d44; --thumb: #24262b; --card: #18191c;
  --hi: #ffe866; --hi-soft: #1d1e22; --hi-line: #ffe866; --mark: rgba(255, 232, 102, .32); --on-hi: #1f1f1c;
  --up: #b9e8c6; --up-bg: #15281c; --down: #f7c2b8; --down-bg: #33191a;
  --blob: #050506; --eye: #fff8e1; --shadow: #000000; color-scheme: dark; }
/* The page's own switch wins over the host theme: same specificity, later in the cascade. */
:root[data-osrc-theme="light"] { --paper: #fbfaf7; --ink: #1f1f1c; --line: #cbc7bd; --thumb: #efede7; --card: #ffffff;
  --hi: #ffe866; --hi-soft: #fff7c7; --hi-line: #1f1f1c; --mark: #ffe866; --on-hi: #1f1f1c;
  --up: #10331a; --up-bg: #dff5e3; --down: #5c1a12; --down-bg: #fbe3dc;
  --blob: #1f1f1c; --eye: #fff8e1; --shadow: #1f1f1c; color-scheme: light; }
:root[data-osrc-theme="dark"] { --paper: #0f1012; --ink: #eceef2; --line: #3a3d44; --thumb: #24262b; --card: #18191c;
  --hi: #ffe866; --hi-soft: #1d1e22; --hi-line: #ffe866; --mark: rgba(255, 232, 102, .32); --on-hi: #1f1f1c;
  --up: #b9e8c6; --up-bg: #15281c; --down: #f7c2b8; --down-bg: #33191a;
  --blob: #050506; --eye: #fff8e1; --shadow: #000000; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100%; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--hi); outline-offset: 2px; }
.mark { background: linear-gradient(transparent 55%, var(--mark) 55%); padding: 0 .1em; }
.lg { stroke: var(--ink); } .lg-body { fill: var(--blob); } .lg-hi { fill: var(--hi); } .lg-eye { fill: var(--eye); }

.rail { color: var(--ink); background: var(--card); border-right: 1.5px solid var(--ink); display: flex; flex-direction: column; gap: 20px; padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
.brand svg { width: 54px; height: 54px; flex: none; }
.brand .wm { font-weight: 700; font-size: 1.35rem; line-height: 1.1; }
.brand .tag { font-family: var(--mono); font-size: .78rem; font-weight: 700; }
.rail h2 { margin: 0; font-size: 1rem; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
.plist { display: flex; flex-direction: column; gap: 8px; }
.proj { display: flex; flex-direction: column; gap: 4px; border-radius: 14px; border: 1.5px solid transparent; padding: 6px; }
.proj.on { background: var(--hi-soft); border-color: var(--hi-line); }
.pbtn { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: none; border: 0; padding: 6px 6px; border-radius: 10px; cursor: pointer; text-align: left; width: 100%; }
.pbtn .nm { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--card); }
.dot.building { background: var(--thumb); }
.dot.waiting { background: var(--hi); }
.dot.shipped { background: var(--up-bg); border-color: var(--up); }
.dot.paused { border-style: dashed; }
.dlist { list-style: none; margin: 0; padding: 0 0 0 22px; display: flex; flex-direction: column; gap: 2px; }
.dbtn { display: flex; gap: 8px; align-items: center; background: none; border: 0; padding: 4px 6px; border-radius: 8px; cursor: pointer; text-align: left; width: 100%; font-size: .9rem; }
.dbtn span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dbtn:hover, .pbtn:hover { background: var(--thumb); }
.pri { flex: none; display: inline-flex; align-items: center; font-family: var(--mono); font-weight: 700; font-size: .7rem; padding: 1px 8px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--card); }
.p-critical { background: var(--down-bg); color: var(--down); border-color: var(--down); }
.p-high { background: var(--hi); color: var(--on-hi); border-color: var(--ink); }
.p-medium { background: var(--thumb); }
.credits { margin-top: auto; display: flex; flex-direction: column; gap: 12px; border-top: 1.5px solid var(--ink); padding-top: 16px; font-size: .9rem; }
.credits a { color: var(--ink); }
.star { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; text-decoration: none; font-weight: 600; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--hi); color: var(--on-hi) !important; }
.star:hover { box-shadow: 3px 3px 0 var(--shadow); transform: translate(-1px, -1px); }
.star .cnt { font-family: var(--mono); border-left: 1.5px solid var(--on-hi); padding-left: 8px; }
.social { display: flex; gap: 14px; align-items: center; }
.social a { display: inline-flex; }
.social a:hover { transform: translateY(-1px); }
.theme-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tgl { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; }
.tgl button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--card); padding: 4px 12px; cursor: pointer; font-size: .85rem; font-weight: 600; }
.tgl button[aria-pressed="true"] { background: var(--hi); color: var(--on-hi); }

.main { padding-block: 32px 64px; padding-left: max(16px, 4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4vw); display: flex; flex-direction: column; gap: 32px; min-width: 0; max-width: 1100px; }
.ph { display: flex; flex-direction: column; gap: 10px; }
.ph h1 { margin: 0; font-weight: 700; font-size: clamp(2rem, 4.5vw, 3rem); line-height: 1.1; text-wrap: balance; }
.ph .lede { margin: 0; max-width: 62ch; font-size: 1.1rem; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--card); white-space: nowrap; }
.stamp { font-family: var(--mono); font-weight: 700; background: var(--hi-soft); border-color: var(--hi-line); }
.board-link { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--on-hi); background: var(--hi); border: 1.5px solid var(--ink); font-weight: 600; padding: 4px 14px; border-radius: 999px; }
.board-link:hover { box-shadow: 3px 3px 0 var(--shadow); transform: translate(-1px, -1px); }
.stats { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
.card { color: var(--ink); background: var(--card); border: 1.5px solid var(--ink); border-radius: 16px; padding: 20px; min-width: 0; }
.stat { display: flex; flex-direction: column; gap: 10px; }
.stat .k { font-weight: 600; }
.big { font-family: var(--mono); font-weight: 700; font-size: clamp(2.8rem, 7vw, 4.2rem); line-height: 1; }
.stat.wait { background: var(--hi-soft); border-color: var(--hi-line); }
.mid { font-weight: 700; font-size: 1.5rem; line-height: 1.2; }
.bar { height: 16px; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; background: var(--thumb); }
.bar > span { display: block; height: 100%; width: 0; background: var(--hi); border-right: 1.5px solid var(--ink); }
section { display: flex; flex-direction: column; gap: 14px; }
section > h2 { margin: 0; font-size: 1.5rem; font-weight: 600; }
.lanes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; text-align: left; width: 100%; }
.tile:hover { border-color: var(--ink); }
.flow-scroll { overflow-x: auto; padding-bottom: 4px; }
.flow { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(130px, 1fr); min-width: 0; align-items: stretch; }
.node { position: relative; display: flex; flex-direction: column; gap: 6px; margin-right: 28px; padding: 14px; border: 1.5px solid var(--ink); border-radius: 16px; background: var(--card); cursor: pointer; text-align: left; }
.node:last-child { margin-right: 0; }
.node::after { content: ""; position: absolute; right: -24px; top: 50%; width: 20px; height: 1.5px; background: var(--ink); }
.node::before { content: ""; position: absolute; right: -25px; top: calc(50% - 5px); border: 5.5px solid transparent; border-left: 7px solid var(--ink); border-right: 0; }
.node:last-child::after, .node:last-child::before { display: none; }
.node .n { font-family: var(--mono); font-weight: 700; font-size: 1.8rem; line-height: 1; }
.node .t { font-weight: 600; line-height: 1.2; }
.node .w { font-size: .88rem; }
.node.now { background: var(--hi-soft); border-color: var(--hi-line); }
.node.done { background: var(--up-bg); }
.themes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.theme { display: flex; flex-direction: column; gap: 12px; }
.theme h3 { margin: 0; font-size: 1.15rem; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.theme .lanes { grid-template-columns: 1fr; }
.refs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.refs a { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: .72rem; font-weight: 700; color: var(--ink); text-decoration: none; padding: 0 7px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--paper); }
.refs a:hover { border-color: var(--ink); background: var(--hi); color: var(--on-hi); }
.refs svg { width: 11px; height: 11px; }
.where { font-family: var(--mono); font-size: .8rem; overflow-wrap: anywhere; }
.tile .nm { display: flex; flex-direction: column; }
.tile.has-open { grid-template-columns: 44px minmax(0, 1fr) auto auto; }
.open { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--card); cursor: pointer; white-space: nowrap; }
.open:hover { background: var(--hi); color: var(--on-hi); }
.open.ok { background: var(--up-bg); color: var(--up); border-color: var(--up); }
.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); max-width: calc(100vw - 32px); color: var(--ink); background: var(--card); border: 1.5px solid var(--ink); border-radius: 14px; padding: 10px 14px; box-shadow: 4px 4px 0 var(--shadow); display: flex; flex-direction: column; gap: 6px; }
.toast code { font-family: var(--mono); font-size: .85rem; background: var(--thumb); padding: 4px 8px; border-radius: 8px; user-select: all; overflow-wrap: anywhere; }
.tile .nm { font-weight: 500; line-height: 1.25; min-width: 0; }
.ring { width: 44px; height: 44px; }
.ring .bg { stroke: var(--thumb); } .ring .fg { stroke: var(--ink); }
.ring text { font-family: var(--mono); font-size: 11px; font-weight: 700; fill: var(--ink); }
.s-merged, .s-done { background: var(--up-bg); color: var(--up); border-color: var(--up); }
.s-review { background: var(--hi-soft); }
.s-building { background: var(--thumb); }
.s-blocked { background: var(--down-bg); color: var(--down); border-color: var(--down); }
.decs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.dec { display: flex; flex-direction: column; gap: 10px; background: var(--hi-soft); border-color: var(--hi-line); }
.dec.flash { box-shadow: 4px 4px 0 var(--shadow); }
.dec .q { font-weight: 600; font-size: 1.1rem; line-height: 1.3; }
.dec .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lbl { display: inline-flex; font-size: .8rem; font-weight: 500; padding: 2px 10px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); }
.ans { display: flex; flex-direction: column; gap: 10px; border-top: 1.5px solid var(--ink); padding-top: 12px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--card); cursor: pointer; font-weight: 500; }
.opt[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.ans textarea { font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--ink); border-radius: 12px; padding: 10px 12px; min-height: 64px; resize: vertical; width: 100%; }
.go { align-self: flex-start; padding: 8px 18px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--hi); color: var(--on-hi); font-weight: 600; cursor: pointer; }
.go:disabled { opacity: .5; cursor: default; }
.saved { font-weight: 600; color: var(--up); }
.decided summary { cursor: pointer; font-weight: 600; }
.decided ul { margin: 12px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.hc { position: fixed; z-index: 20; max-width: min(340px, calc(100vw - 32px)); color: var(--ink); background: var(--card); border: 1.5px solid var(--ink); border-radius: 16px; padding: 14px 16px; box-shadow: 4px 4px 0 var(--shadow); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.hc .ht { font-weight: 700; line-height: 1.25; }
.hc .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .9rem; }
.hc p { margin: 0; font-size: .95rem; }
.foot { font-size: .9rem; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1.5px solid var(--ink); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .credits { margin-top: 0; }
  .stats, .lanes, .decs, .themes { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .bar > span { transition: width .6s ease; } .star, .board-link { transition: transform .15s, box-shadow .15s; } }
</style>

        if (!list.length) return;
        const avg = Math.round(list.reduce((s, l) => s + (l.pct || 0), 0) / list.length);
        const box = el('div', 'card theme'); const h = el('h3'); h.append(el('span', null, th.t), el('span', 'mono', avg + '%'));
        const grid = el('div', 'lanes'); list.forEach((l) => grid.appendChild(laneTile(l)));
        box.append(h, grid); wrap.appendChild(box);
      });
      const orphans = (p.themes && p.themes.length) ? lanes.filter((l) => !p.themes.some((th) => th.k === l.theme)) : [];
      if (orphans.length) { const box = el('div', 'card theme'); box.append(el('h3', null, 'Other')); const grid = el('div', 'lanes'); orphans.forEach((l) => grid.appendChild(laneTile(l))); box.appendChild(grid); wrap.appendChild(box); }
      if (wrap.children.length === 1) wrap.style.gridTemplateColumns = '1fr';
      sec2.appendChild(wrap); main.appendChild(sec2);
    }
    main.appendChild(el('p', 'foot', 'Each orchestrator updates its own project here as work moves. Answers you send land with that orchestrator at its next check.'));
  }

  function decCard(p, d) {
    const c = el('div', 'card dec'); c.id = 'dec-' + d.id;
    const tags = el('div', 'tags'); tags.appendChild(pri(d.weight));
    (d.affects || []).forEach((a) => tags.appendChild(el('span', 'lbl', a)));
    c.append(tags, el('span', 'q', d.q));
    if (d.rec) c.append(el('span', null, d.rec));
    if (d.when) c.append(el('span', 'mono', 'Needed by ' + d.when));
    const a = el('div', 'ans'); const opts = el('div', 'opts');
    const f = { choice: '', btns: [] };
    (d.options || []).forEach((o, i) => {
      const b = el('button', 'opt', o); b.type = 'button'; b.id = 'opt-' + p.id + '-' + d.id + '-' + i; b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => { f.choice = f.choice === o ? '' : o; f.btns.forEach((x) => x.setAttribute('aria-pressed', String(x.textContent === f.choice))); sync(); });
      f.btns.push(b); opts.appendChild(b);
    });
    const ta = document.createElement('textarea'); ta.id = 'note-' + p.id + '-' + d.id; ta.placeholder = 'Anything to add, or your own answer'; ta.setAttribute('aria-label', 'Note');
    const go2 = el('button', 'go', 'Send to Claude'); go2.type = 'button'; go2.id = 'send-' + p.id + '-' + d.id;
    const st = el('span', 'saved'); st.setAttribute('aria-live', 'polite');
    const sync = () => { go2.disabled = !db || (!f.choice && !ta.value.trim()); };
    ta.addEventListener('input', sync); sync();
    if (!db) st.textContent = 'Answering works when you are signed in on claude.ai.';
    go2.addEventListener('click', async () => {
      go2.disabled = true; st.textContent = 'Saving…';
      try {
        await db.doc('answers/' + p.id + '--' + d.id).set({ project: p.id, decision: d.id, question: d.q, choice: f.choice, note: ta.value.trim(), at: new Date().toISOString() });
        st.textContent = 'Sent. The orchestrator picks it up at its next check.';
      } catch (e) { st.textContent = 'Not saved: ' + ((e && e.message) || 'try again'); sync(); }
    });
    a.append(opts, ta, go2, st); c.appendChild(a);
    return c;
  }

  function go(pid, did) {
    current = pid;
    try { if (location.hash !== '#' + pid) history.replaceState(null, '', '#' + pid); } catch (e) {}
    renderRail(); renderMain();
    if (did) { const c = document.getElementById('dec-' + did); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('flash'); setTimeout(() => c.classList.remove('flash'), 1600); } }
    else window.scrollTo({ top: 0 });
  }
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== current && projects.some((p) => p.id === h)) go(h); });

  function pickStart() {
    const h = location.hash.slice(1);
    if (h && projects.some((p) => p.id === h)) return h;
    const w = projects.find((p) => openDecs(p).length);
    return (w || projects[0] || {}).id || null;
  }

  (async () => {
    const timer = setTimeout(() => { if (!projects.length) renderRail(); }, 10000);
    let real = null;
    try { real = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { real = null; }
    if (real) {
      mode = 'artifact'; db = real;
      subscribe(db);
      clearTimeout(timer);
      return;
    }
    // No artifact db: local mode via hub serve (token in the URL).
    mode = 'local';
    db = makeLocalDb();
    subscribe(db);
    clearTimeout(timer);
    // First pull failure surfaces in the rail instead of hanging on "Loading…".
    setTimeout(() => { if (!projects.length) renderRail(); }, 3000);
  })();

  (function stars() {
    let n = null;
    try { n = sessionStorage.getItem('osrc-stars'); } catch (e) {}
    const show = (v) => { if (v == null) return; const s = $('stars'); s.textContent = Number(v) >= 1000 ? (Number(v) / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(v); s.hidden = false; };
    if (n) { show(n); return; }
    fetch('https://api.github.com/repos/alexgreensh/outsourcerer').then((r) => r.ok ? r.json() : null).then((j) => { if (j && typeof j.stargazers_count === 'number') { show(j.stargazers_count); try { sessionStorage.setItem('osrc-stars', j.stargazers_count); } catch (e) {} } }).catch(() => {});
  })();
})();
</script>
